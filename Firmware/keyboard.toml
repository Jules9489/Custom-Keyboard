# Documentation: https://rmk.rs/docs/configuration.html
[keyboard]
name = "RMK Keyboard"
product_name = "RMK Keyboard"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "RMK"
chip = "rp2040"

[matrix]
# Row and col pins are mandatory
row_pins = ["PIN_0", "PIN_1", "PIN_2", "PIN_3", "PIN_4"]
col_pins = ["PIN_5", "PIN_6", "PIN_7", "PIN_8", "PIN_9", "PIN_10", "PIN_11", "PIN_12", "PIN_13", "PIN_14", "PIN_15", "PIN_16", "PIN_17", "PIN_18", "PIN_19"]

# RMK uses col2row as the default matrix diode direction; if you want to use a row2col matrix, add `row2col = true`
# row2col = true

[layout]
rows = 5
cols = 15
layers = 2
keymap = [
    [
        ["Escape", "Kc1", "Kc2", "Kc3", "Kc4", "Kc5", "Kc6", "Kc7", "Kc8", "Kc9", "Kc0", "Minus", "Equal", "Backspace", "PrintScreen"],
        ["Tab", "Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P", "LeftBracket", "RightBracket", "NonusBackslash", "Home"],
        ["CapsLock", "A", "S", "D", "F", "G", "H", "J", "K", "L", "Semicolon", "Quote", "Enter", "PageUp", "No"],
        ["LShift", "Z", "X", "C", "V", "B", "N", "M", "Comma", "Dot", "Slash", "RShift", "Up", "PageDown", "No"],
        ["LCtrl", "LGui", "LAlt", "Space", "RAlt", "MO(1)", "Left", "Down", "Right", "No", "No", "No", "No", "No", "No"]
    ],
    [
    
       ["Grave", "F1", "F2", "F3", "F4", "F5", "F6", "F7", "F8", "F9", "F10", "F11", "F12", "_", "_"],
       ["_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_"],
       ["_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_"],
       ["_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "_", "AudioVolUp", "_", "_"],
       ["_", "_", "_", "_", "_", "_", "MediaPrevTrack", "AudioVolDown", "MediaNextTrack", "No", "No", "No", "No", "No", "No"]
    ],
]
